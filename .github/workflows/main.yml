name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Buildozer
        run: pip install --upgrade buildozer cython setuptools

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            mobile/.buildozer
          key: buildozer-${{ hashFiles('mobile/buildozer.spec') }}

      - name: Build
        working-directory: mobile
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: luvvix-apk
          path: mobile/bin/*.apk
